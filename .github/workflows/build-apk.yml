name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project with Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle script executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for clarity
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/*.apk release-output/DailyToDoApp-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyToDoApp-Release-APK
          path: release-output/DailyToDoApp-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: Daily To-Do App v1.0.0 Release
          body: |
            ## Daily To-Do & Productivity Tracker Mobile Application (v1.0.0)
            
            - **Platform**: Android
            - **Architecture**: 100% Offline with Expo SQLite & SecureStore
            - **First-Time Access Gate Passcode**: `SatyamMishraToDoApp2026`
            
            ### Installation Instructions:
            1. Download the **`DailyToDoApp-v1.0.0.apk`** asset attached below.
            2. Open the file on your Android phone and install.
            3. Enter your access code on first launch to unlock your offline dashboard.
          files: release-output/DailyToDoApp-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
