name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle script executable
        run: chmod +x android/gradlew

      - name: Compile Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m" \
            -Dorg.gradle.workers.max=2

      - name: Verify and Prepare APK File
        run: |
          mkdir -p release-output
          RELEASE_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi
          echo "Generated APK found at: $RELEASE_APK"
          cp "$RELEASE_APK" release-output/ToDo.apk
          cp "$RELEASE_APK" ./ToDo.apk
          echo "APK file size and info:"
          ls -lh release-output/ToDo.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDo-APK
          path: release-output/ToDo.apk
          retention-days: 30

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: Daily To-Do App v1.0.0 (Installable APK)
          body: |
            ## 📱 Daily To-Do & Productivity Tracker Mobile Application (v1.0.0)

            This is the official compiled, signed Android APK for **Daily Track & Achieve**.

            ### 📲 How to Download and Install:
            1. Under **Assets** below, click **`ToDo.apk`** to download it directly to your phone.
            2. Open the downloaded file on your Android device.
            3. If Android displays *"For your security, your phone is not allowed to install unknown apps"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install**.
            5. Open the app and enter the required access code:
               ```
               SatyamMishraToDoApp2026
               ```

            ### ✨ Key Features:
            - **100% Offline**: Local SQLite database with WAL mode and transaction integrity.
            - **Recurring Tasks**: Automatic occurrence engine with individual daily completion history.
            - **Smart Notifications**: Scheduled device-local alarms for pending tasks.
            - **Analytics**: Real interactive Line, Bar, and Dot Habit Heatmap graphs.
          files: release-output/ToDo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Compiled ToDo.apk into Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ToDo.apk
          git diff --staged --quiet || (git commit -m "chore(release): update compiled ToDo.apk binary [skip ci]" && git pull --rebase origin main && git push origin main) || echo "Repository push skipped"
